name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  library:
    name: Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      # ssg, content and devserver run on the host; the reactive core has no
      # build constraints so it does too. -race because Build and CompileScripts
      # fan work out across goroutines and devserver has a watcher, a server and
      # a subscriber set running at once.
      - name: Test (host)
        run: go test -race ./ssg/ ./content/ ./devserver/ ./reactive/

      # wasmwrap, jsdom and reactive's DOM half need a JS runtime.
      # go_js_wasm_exec drives them through node.
      - name: Test (js/wasm)
        run: |
          export PATH="$PATH:$(go env GOROOT)/lib/wasm"
          GOOS=js GOARCH=wasm go build ./...
          GOOS=js GOARCH=wasm go vet ./...
          GOOS=js GOARCH=wasm go test ./wasmwrap/ ./reactive/ ./jsdom/
