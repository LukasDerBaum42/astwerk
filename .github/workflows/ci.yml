name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  library:
    name: Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      # ssg, content, assets and devserver run on the host. -race because Build
      # and CompileScripts fan work out across goroutines and devserver has a
      # watcher, a server and a subscriber set running at once.
      - name: Test (host)
        run: go test -race ./ssg/ ./content/ ./assets/ ./devserver/
